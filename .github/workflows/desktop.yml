name: Desktop

on:
  pull_request:
    paths: ["desktop/**", "hub/**", "studio/**", "package.json", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck and lint
        run: npm run check
      - name: Tests (studio + hub)
        run: npm test
      - name: Smoke test (stage, launch, one agent run against a mock API)
        run: xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: desktop/release/smoke

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            app: release/mac-arm64/Siljangnim.app/Contents/MacOS/Siljangnim
            files: desktop/release/*.dmg
          - os: windows-latest
            app: release/win-unpacked/Siljangnim.exe
            files: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged app
        working-directory: desktop
        run: npm run smoke
        env:
          SILJANGNIM_APP_PATH: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.dmg
            *.exe
