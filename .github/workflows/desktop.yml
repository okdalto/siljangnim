name: Desktop

on:
  pull_request:
    paths: ["desktop/**", "hub/**", "studio/**", "mcp/**", "examples/**", "package.json", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck and lint
        run: npm run check
      - name: Tests (studio + mcp + hub)
        run: npm test
      - name: Smoke test (desktop agent run against a mock API, then an MCP client driving the viewer)
        run: xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: |
            desktop/release/smoke
            mcp/smoke-out/report.json
            mcp/smoke-out/viewer.png

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            app: release/mac-arm64/Siljangnim.app/Contents/MacOS/Siljangnim
            files: desktop/release/*.dmg
          - os: windows-latest
            app: release/win-unpacked/Siljangnim.exe
            files: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Signed when the repository has the certificate secrets (see desktop/electron-builder.signed.yml);
      # unsigned otherwise.
      - name: Build installer
        run: npm run dist
        env:
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Immutable sources match the build-time hashes; keep media out of installers.
          SILJANGNIM_EXAMPLES_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/examples
      - name: Smoke test packaged app
        working-directory: desktop
        run: npm run smoke
        env:
          SILJANGNIM_APP_PATH: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.dmg
            *.exe
