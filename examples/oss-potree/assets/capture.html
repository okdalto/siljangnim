<!doctype html><html><head><meta charset="utf-8"><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}</style></head><body><div id="view"></div><script src="libs/jquery/jquery-3.1.1.min.js"></script><script src="libs/spectrum/spectrum.js"></script><script src="libs/jquery-ui/jquery-ui.min.js"></script><script src="libs/other/BinaryHeap.js"></script><script src="libs/tween/tween.min.js"></script><script src="libs/d3/d3.js"></script><script src="libs/proj4/proj4.js"></script><script src="libs/openlayers3/ol.js"></script><script src="libs/i18next/i18next.js"></script><script src="libs/jstree/jstree.js"></script><script src="build/potree/potree.js"></script><script src="libs/plasio/js/laslaz.js"></script><script>
const viewer=new Potree.Viewer(document.getElementById('view'));window.viewer=viewer;
viewer.setEDLEnabled(false);viewer.setFOV(55);viewer.setPointBudget(10000);viewer.setBackground('black');
Potree.loadPointCloud('own-cloud/cloud.js','Synthetic waves',e=>{window.cloud=e.pointcloud;viewer.scene.addPointCloud(cloud);cloud.material.size=3;cloud.material.pointSizeType=Potree.PointSizeType.FIXED;cloud.material.shape=Potree.PointShape.CIRCLE;viewer.scene.view.position.set(15,-13,13);viewer.scene.view.lookAt(5,5,2);});
window.capture=async(index)=>{
 for(let i=0;i<200&&(!window.cloud||!cloud.pcoGeometry.root.loaded||viewer.scene.pointclouds[0].visibleNodes.length===0);i++)await new Promise(r=>setTimeout(r,50));
 if(!cloud.pcoGeometry.root.loaded)throw Error('Native cloud loader did not finish');
 const names=['rgba','elevation','rgba'];cloud.material.activeAttributeName=names[index];cloud.material.elevationRange=[0,6];cloud.material.size=[2,3,5][index];
 viewer.update(0,0);viewer.render();
 return {png:viewer.renderer.domElement.toDataURL('image/png'),points:cloud.pcoGeometry.root.numPoints,visiblePoints:cloud.numVisiblePoints,attribute:names[index],size:cloud.material.size};
};
</script></body></html>
